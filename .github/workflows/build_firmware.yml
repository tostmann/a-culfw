name: Build Firmware

# Build on pushes to master/main and on pull requests against them.
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      # CUL_V3 and CUL_V3_DUDETTE are the images this repository ships (default_envs).
      - name: Build CUL_V3 and CUL_V3_DUDETTE
        run: |
          cd culfw
          pio run -e CUL_V3 -e CUL_V3_DUDETTE

      # collect_binaries.py copies the built images into binaries/ and writes
      # manifest.json.
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: a-culfw-${{ github.run_number }}
          path: |
            binaries/CUL_V3.hex
            binaries/CUL_V3_DUDETTE.hex
            binaries/manifest.json
          if-no-files-found: error

  # The PlatformIO job above builds the shipped images only. Everything else in
  # culfw/Devices/ is built only by its own makefile, and nothing checked those
  # for years — long enough for CUNO to end up 300 bytes over its RAM without
  # anyone noticing. This job compiles them on every push; nothing it builds
  # is uploaded.
  #
  # Covers the ARM devices CUBe and CUL-HM-CFG too. MapleCUN is skipped: no
  # images are built for it.
  make-devices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi
          avr-gcc --version | head -1
          arm-none-eabi-gcc --version | head -1

      - name: Build every device from its makefile
        run: |
          cd culfw/Devices
          fail=""
          for d in */; do
            n="${d%/}"
            [ "$n" = "MapleCUN" ] && continue
            [ -f "$n/makefile" ] || [ -f "$n/Makefile" ] || continue
            echo "::group::$n"
            if ( cd "$n" && make all ); then echo "$n OK"; else echo "$n FAILED"; fail="$fail $n"; fi
            echo "::endgroup::"
          done
          if [ -n "$fail" ]; then echo "failed:$fail"; exit 1; fi
          echo "all devices built"
